# Local demonstration hosts only. Tenant database resolution arrives in Module 2.
server {
    listen 80 default_server;
    server_name _;
    return 400;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    include /etc/nginx/tailorspadi-proxy.conf;

    location = /api { proxy_pass http://api:8080; }
    location /api/ { proxy_pass http://api:8080; }
    location /health/ { proxy_pass http://api:8080; }
    location /storefront-assets/ { proxy_pass http://storefront; }
    location /backoffice-assets/ { proxy_pass http://backoffice; }
    location /admin-assets/ { proxy_pass http://admin; }
    location ~ ^/(register|onboarding)(/|$) { proxy_pass http://backoffice; }
    location ~ ^/admin(/|$) { proxy_pass http://admin; }
    location / { proxy_pass http://storefront; }
}

server {
    listen 80;
    server_name johnfashion-001.localhost;
    include /etc/nginx/tailorspadi-proxy.conf;

    location = /api { proxy_pass http://api:8080; }
    location /api/ { proxy_pass http://api:8080; }
    location /health/ { proxy_pass http://api:8080; }
    location /storefront-assets/ { proxy_pass http://storefront; }
    location /backoffice-assets/ { proxy_pass http://backoffice; }
    location ~ ^/(login|backoffice)(/|$) { proxy_pass http://backoffice; }
    location / { proxy_pass http://storefront; }
}
