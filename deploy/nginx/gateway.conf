# Omit query strings, cookies and authorization values, including password-reset tokens.
log_format safe_request '$remote_addr $request_method $uri $status';
access_log /var/log/nginx/access.log safe_request;

# Host-based routing for local demonstration. The API decides which tenant a host belongs to
# (unknown hosts answer 404, suspended tenants 403); this file only chooses which front end serves a path.
# `$http_host` is passed unchanged so the API sees the same host the browser used.

# Anything that is not the platform host or a tenant host is refused.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    server_name _;
    return 400;
}

# Redirect accepted hosts to HTTPS before serving pages or authentication endpoints.
server {
    listen 80;
    server_name ${TENANCY_BASE_DOMAIN} *.${TENANCY_BASE_DOMAIN} localhost 127.0.0.1;
    return 308 https://$host:${GATEWAY_HTTPS_PORT}$request_uri;
}

# Platform host: public landing, tailor registration, sign-in, onboarding and platform administration.
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    server_name ${TENANCY_BASE_DOMAIN} localhost 127.0.0.1;
    include /etc/nginx/tailorspadi-proxy.conf;

    location = /api { proxy_pass http://api:8080; }
    location /api/ { proxy_pass http://api:8080; }
    location /health/ { proxy_pass http://api:8080; }
    location /storefront-assets/ { proxy_pass http://storefront; }
    location /backoffice-assets/ { proxy_pass http://backoffice; }
    location /admin-assets/ { proxy_pass http://admin; }
    location ~ ^/(register|login|forgot-password|reset-password|onboarding|businesses)(/|$) { proxy_pass http://backoffice; }
    location ~ ^/admin(/|$) { proxy_pass http://admin; }
    location / { proxy_pass http://storefront; }
}

# Every tenant host: <slug>.localhost. Unknown slugs reach the API, which answers 404 tenant_not_found.
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    server_name *.${TENANCY_BASE_DOMAIN};
    include /etc/nginx/tailorspadi-proxy.conf;

    location = /api { proxy_pass http://api:8080; }
    location /api/ { proxy_pass http://api:8080; }
    location /health/ { proxy_pass http://api:8080; }
    location /storefront-assets/ { proxy_pass http://storefront; }
    location /backoffice-assets/ { proxy_pass http://backoffice; }
    location ~ ^/(login|backoffice|forgot-password|reset-password)(/|$) { proxy_pass http://backoffice; }
    location / { proxy_pass http://storefront; }
}
