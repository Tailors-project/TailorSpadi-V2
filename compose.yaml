name: tailorspadi

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tailorspadi}
      POSTGRES_USER: ${POSTGRES_USER:-tailorspadi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: src/Backend/TailorSpadi.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Database=${POSTGRES_DB:-tailorspadi};Username=${POSTGRES_USER:-tailorspadi};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};Timeout=5"
      ReverseProxy__KnownProxies__0: 172.30.71.10
      Auth__SigningKey: ${AUTH_SIGNING_KEY:?Set AUTH_SIGNING_KEY in .env (at least 32 random characters)}
      Auth__CookieSecure: "true"
      Tenancy__BaseDomain: ${TENANCY_BASE_DOMAIN:-tailorspadi.localhost}
      Tenancy__PlatformHosts__0: ${TENANCY_BASE_DOMAIN:-tailorspadi.localhost}
      Tenancy__PlatformHosts__3: localhost
      AllowedHosts: "${TENANCY_BASE_DOMAIN:-tailorspadi.localhost};*.${TENANCY_BASE_DOMAIN:-tailorspadi.localhost};localhost;127.0.0.1;[::1]"
      Tenancy__PublicScheme: https
      Tenancy__PublicPort: ${GATEWAY_HTTPS_PORT:-8443}
      Storage__Root: /app/storage
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - api-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  storefront:
    build:
      context: .
      dockerfile: src/Frontend/Dockerfile
      args:
        APP_NAME: tailorspadi-storefront

  backoffice:
    build:
      context: .
      dockerfile: src/Frontend/Dockerfile
      args:
        APP_NAME: tailorspadi-backoffice

  admin:
    build:
      context: .
      dockerfile: src/Frontend/Dockerfile
      args:
        APP_NAME: tailorspadi-admin

  gateway:
    image: nginx:stable-alpine
    environment:
      TENANCY_BASE_DOMAIN: ${TENANCY_BASE_DOMAIN:-tailorspadi.localhost}
      GATEWAY_HTTPS_PORT: ${GATEWAY_HTTPS_PORT:-8443}
      NGINX_ENVSUBST_FILTER: '^(TENANCY_BASE_DOMAIN|GATEWAY_HTTPS_PORT)$$'
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
      - "127.0.0.1:${GATEWAY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/proxy.conf:/etc/nginx/tailorspadi-proxy.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - storefront
      - backoffice
      - admin
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--no-check-certificate", "https://127.0.0.1/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      default:
        ipv4_address: 172.30.71.10

volumes:
  postgres-data:
  api-storage:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.71.0/24
