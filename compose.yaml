name: tailorspadi

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tailorspadi}
      POSTGRES_USER: ${POSTGRES_USER:-tailorspadi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: src/Backend/TailorSpadi.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Database=${POSTGRES_DB:-tailorspadi};Username=${POSTGRES_USER:-tailorspadi};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};Timeout=5"
      ReverseProxy__KnownProxies__0: 172.30.71.10
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  storefront:
    build:
      context: .
      dockerfile: src/Frontend/Dockerfile
      args:
        APP_NAME: tailorspadi-storefront

  backoffice:
    build:
      context: .
      dockerfile: src/Frontend/Dockerfile
      args:
        APP_NAME: tailorspadi-backoffice

  admin:
    build:
      context: .
      dockerfile: src/Frontend/Dockerfile
      args:
        APP_NAME: tailorspadi-admin

  gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy.conf:/etc/nginx/tailorspadi-proxy.conf:ro
    depends_on:
      - api
      - storefront
      - backoffice
      - admin
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      default:
        ipv4_address: 172.30.71.10

volumes:
  postgres-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.71.0/24
